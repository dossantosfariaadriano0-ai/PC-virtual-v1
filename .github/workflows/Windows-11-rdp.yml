
name: DESKTOP-RUNNER11 - Windows 11 RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows11:
    name: Start Windows 11 RDP
    runs-on: windows-11-arm
    timeout-minutes: 360

    steps:
      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure Windows RDP and Accounts
        shell: powershell
        env:
          P_XARIMO: ${{ secrets.XARIMO_PASSWORD }}
          P_RUNNER: ${{ secrets.RUNNER_PASSWORD }}
          P_INSTALLER: ${{ secrets.INSTALLER_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Configuring DESKTOP-RUNNER11"

          # Enable Remote Desktop
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" -Value 0

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" -Value 1

          Set-Service -Name TermService -StartupType Manual
          Start-Service -Name TermService

          # Restrict RDP firewall access to Tailscale
          Get-NetFirewallRule -DisplayGroup "Remote Desktop" |
            Disable-NetFirewallRule

          New-NetFirewallRule `
            -DisplayName "RDP Tailscale Only" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress "100.64.0.0/10" `
            -Action Allow `
            -Profile Any

          # Create accounts
          $accounts = @(
            @{Name="Xarimo"; Password=$env:P_XARIMO},
            @{Name="runneradmin"; Password=$env:P_RUNNER},
            @{Name="Installernational"; Password=$env:P_INSTALLER}
          )

          $group = Get-LocalGroup -SID "S-1-5-32-555"

          foreach ($account in $accounts) {
            if ([string]::IsNullOrWhiteSpace($account.Password)) {
              throw "Missing password secret: $($account.Name)"
            }

            $secure = ConvertTo-SecureString `
              $account.Password -AsPlainText -Force

            $user = Get-LocalUser -Name $account.Name `
              -ErrorAction SilentlyContinue

            if ($null -eq $user) {
              New-LocalUser `
                -Name $account.Name `
                -Password $secure `
                -PasswordNeverExpires
            } else {
              Set-LocalUser `
                -Name $account.Name `
                -Password $secure
            }

            Add-LocalGroupMember `
              -Group $group.Name `
              -Member $account.Name `
              -ErrorAction SilentlyContinue

            Write-Host "Account configured: $($account.Name)"
          }

          Write-Host "RDP configuration completed."

      - name: Display Connection Information
        shell: powershell
        run: |
          $ip = (tailscale ip -4 | Select-Object -First 1).Trim()

          Write-Host "================================"
          Write-Host "DEVICE: DESKTOP-RUNNER11"
          Write-Host "SYSTEM: Windows 11 ARM64"
          Write-Host "RDP: $ip`:3389"
          Write-Host "ACCOUNT 1: Xarimo"
          Write-Host "ACCOUNT 2: runneradmin"
          Write-Host "ACCOUNT 3: Installernational"
          Write-Host "================================"

      - name: Keep Server Running
        shell: powershell
        run: |
          Write-Host "DESKTOP-RUNNER11 ONLINE"

          while ($true) {
            Start-Sleep -Seconds 60
          }
          
