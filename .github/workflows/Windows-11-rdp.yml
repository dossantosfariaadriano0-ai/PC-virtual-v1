
name: DESKTOP-RUNNER11 Windows 11 RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows11:
    name: Start Windows 11 ARM64
    runs-on: windows-11-arm
    timeout-minutes: 350

    steps:
      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure Tailscale Device
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          tailscale set --hostname=DESKTOP-RUNNER11

          Write-Host "Tailscale device configured."

      - name: Configure Windows 11 RDP
        shell: powershell
        env:
          XARIMO_PASSWORD: ${{ secrets.XARIMO_PASSWORD }}
          RUNNER_PASSWORD: ${{ secrets.RUNNER_PASSWORD }}
          INSTALLER_PASSWORD: ${{ secrets.INSTALLER_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Configuring Windows 11 RDP..."

          # Enable Remote Desktop
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" -Value 0

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" -Value 1

          # Restrict firewall to Tailscale
          Get-NetFirewallRule -DisplayGroup "Remote Desktop" |
            Disable-NetFirewallRule

          New-NetFirewallRule `
            -DisplayName "RDP Tailscale Only" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress "100.64.0.0/10" `
            -Action Allow `
            -Profile Any

          # Enable RDP service
          Set-Service -Name TermService -StartupType Manual
          Start-Service -Name TermService

          # Create user accounts
          $accounts = @(
            @{Name="Xarimo"; Password=$env:XARIMO_PASSWORD},
            @{Name="runneradmin"; Password=$env:RUNNER_PASSWORD},
            @{Name="Installernational"; Password=$env:INSTALLER_PASSWORD}
          )

          $group = Get-LocalGroup -SID "S-1-5-32-555"

          foreach ($account in $accounts) {

            if ([string]::IsNullOrWhiteSpace($account.Password)) {
              throw "Missing password for $($account.Name)"
            }

            $secure = ConvertTo-SecureString `
              $account.Password -AsPlainText -Force

            $user = Get-LocalUser -Name $account.Name `
              -ErrorAction SilentlyContinue

            if ($null -eq $user) {
              New-LocalUser `
                -Name $account.Name `
                -Password $secure `
                -PasswordNeverExpires
            } else {
              Set-LocalUser -Name $account.Name -Password $secure
            }

            Add-LocalGroupMember `
              -Group $group.Name `
              -Member $account.Name `
              -ErrorAction SilentlyContinue

            Write-Host "Configured: $($account.Name)"
          }

          Write-Host "RDP READY"

      - name: Show Windows 11 Address
        shell: powershell
        run: |
          $ip = (tailscale ip -4 | Select-Object -First 1).Trim()

          if (-not $ip) {
            throw "Tailscale IP not found."
          }

          Write-Host "================================="
          Write-Host "DEVICE: DESKTOP-RUNNER11"
          Write-Host "SYSTEM: WINDOWS 11 ARM64"
          Write-Host "RDP ADDRESS: ${ip}:3389"
          Write-Host "USERNAME: Xarimo"
          Write-Host "================================="

      - name: Keep Windows 11 Online
        shell: powershell
        run: |
          Write-Host "DESKTOP-RUNNER11 ONLINE"

          while ($true) {
            Start-Sleep -Seconds 60
          }
          
